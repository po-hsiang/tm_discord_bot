services:
  tm_discord_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tm_discord_bot:latest
    container_name: tm_discord_bot
    environment:
      - TZ=Asia/Taipei
    # 機敏環境變數（n8n webhook 位址與密鑰等）於啟動時注入，不進映像
    env_file:
      - .env
    # 讓容器能以 host.docker.internal 連到宿主機的 n8n（Docker Desktop 內建，
    # 此設定為移機到 Linux Docker 時的相容保險）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GCP 服務帳戶憑證以唯讀掛載；映像本身不再包含任何機敏檔案
    volumes:
      - ./tm_discord_bot/json:/app/tm_discord_bot/json:ro
    # 加入 ai-net 共用網路，以服務名直連 yt-music-mcp 歌單微服務
    networks:
      - default
      - ai-net
    # 長期運行（restart: always）的容器日誌設上限：10MB × 5 檔，最多佔 50MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

networks:
  ai-net:
    external: true
